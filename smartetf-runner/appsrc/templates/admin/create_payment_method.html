{% extends "layout.html" %}

{% block title %}Add Payment Method - ETF Trading Portal{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col d-flex justify-content-between align-items-center">
        <h2>Add New Payment Method</h2>
        <a href="{{ url_for('admin_payment_methods') }}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-1"></i> Back to Payment Methods
        </a>
    </div>
</div>

<div class="card shadow">
    <div class="card-header">
        <h5 class="mb-0">Payment Method Details</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin_create_payment_method') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Method Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="is_active" name="is_active" checked>
                <label class="form-check-label" for="is_active">Active</label>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('admin_payment_methods') }}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Add Payment Method</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
