{% extends "layout.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Set a new password</h3>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password" required>
              <button type="button" class="btn btn-outline-secondary toggle-password" data-target="#password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
              <button type="button" class="btn btn-outline-secondary toggle-password" data-target="#confirm_password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('login') }}" class="small">Back to login</a>
            <button type="submit" class="btn btn-primary">Update password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% block additional_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.toggle-password').forEach(function(btn){
      btn.addEventListener('click', function(){
        const target = document.querySelector(this.getAttribute('data-target'));
        const type = target.getAttribute('type') === 'password' ? 'text' : 'password';
        target.setAttribute('type', type);
        const icon = this.querySelector('i');
        if (type === 'text') { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
        else { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
      });
    });
  });
</script>
{% endblock %}
{% endblock %}
