{% extends "layout.html" %}

{% block title %}Edit Referrer - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="mb-0">Edit Referrer</h2>
    <p class="text-muted mb-0">Update referrer details.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin_referrers') }}">Back</a>
</div>

<div class="card shadow">
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin_edit_referrer', referrer_id=referrer.id) }}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="name">Name *</label>
          <input class="form-control" id="name" name="name" value="{{ referrer.name }}" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="mobile">Phone</label>
          <input class="form-control" id="mobile" name="mobile" value="{{ referrer.mobile or '' }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" value="{{ referrer.email or '' }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="default_commission_percent">Default Commission %</label>
          <input class="form-control" id="default_commission_percent" name="default_commission_percent" type="number" min="0" max="100" step="0.01" value="{{ referrer.default_commission_percent or 0 }}">
        </div>
        <div class="col-md-6 mb-3 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if referrer.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a class="btn btn-outline-secondary" href="{{ url_for('admin_referrers') }}">Cancel</a>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
