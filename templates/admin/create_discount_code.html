{% extends "layout.html" %}
{% block title %}Create Discount Code - Admin{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('admin_discount_codes') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 class="mb-0">Create Discount Code</h2>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Code <span class="text-danger">*</span></label>
                            <input type="text" name="code" class="form-control text-uppercase" placeholder="e.g. SAVE20" required>
                            <small class="text-muted">Will be auto-capitalized</small>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Discount Type <span class="text-danger">*</span></label>
                            <select name="discount_type" class="form-select">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (₹)</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Value <span class="text-danger">*</span></label>
                            <input type="number" name="discount_value" class="form-control" step="0.01" min="0.01" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Max Uses</label>
                            <input type="number" name="max_uses" class="form-control" value="0" min="0">
                            <small class="text-muted">0 = Unlimited</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Valid From</label>
                            <input type="date" name="valid_from" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Valid Until</label>
                            <input type="date" name="valid_until" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Applicable Plans</label>
                            <select name="applicable_plan_ids" class="form-select">
                                <option value="">All Plans</option>
                                {% for plan in plans %}
                                <option value="{{ plan.id }}">{{ plan.name }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">Leave blank for all plans</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Applicable Billing Cycles</label>
                            <select name="applicable_billing_cycles" class="form-select">
                                <option value="">All Cycles</option>
                                <option value="monthly">Monthly</option>
                                <option value="quarterly">Quarterly</option>
                                <option value="half_yearly">Half Yearly</option>
                                <option value="annually">Annually</option>
                            </select>
                            <small class="text-muted">Leave blank for all cycles</small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked>
                            <label class="form-check-label" for="is_active">Active</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i>Create Code
                        </button>
                        <a href="{{ url_for('admin_discount_codes') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
