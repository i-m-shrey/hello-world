{% extends "layout.html" %}

{% block title %}Edit Plan - ETF Trading Portal{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col d-flex justify-content-between align-items-center">
        <h2>Edit Plan</h2>
        <a href="{{ url_for('admin_view_plan', plan_id=plan.id) }}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-1"></i> Back to Plan Details
        </a>
    </div>
</div>

<div class="card shadow">
    <div class="card-header">
        <h5 class="mb-0">Plan Details</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin_edit_plan', plan_id=plan.id) }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="name" class="form-label">Plan Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ plan.name }}" required>
                    </div>

<!--                    <div class="mb-3">-->
<!--                        <label for="duration" class="form-label">Duration (days)</label>-->
<!--                        <input type="number" class="form-control" id="duration" name="duration" value="{{ plan.duration }}" min="1" required>-->
<!--                    </div>-->

                    <div class="mb-3">
                        <label for="monthly_price" class="form-label">Monthly Price (₹)</label>
                        <input type="number" step="0.01" name="monthly_price" id="monthly_price" class="form-control" value="{{ plan.monthly_price }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="quarterly_price" class="form-label">Quarterly Price (₹)</label>
                        <input type="number" step="0.01" name="quarterly_price" id="quarterly_price" class="form-control" value="{{ plan.quarterly_price }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="half_yearly_price" class="form-label">Half-Yearly Price (₹)</label>
                        <input type="number" step="0.01" name="half_yearly_price" id="half_yearly_price" class="form-control" value="{{ plan.half_yearly_price }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="annually_price" class="form-label">Annually Price (₹)</label>
                        <input type="number" step="0.01" name="annually_price" id="annually_price" class="form-control" value="{{ plan.annually_price }}" required>
                    </div>


                    <div class="mb-3">
                        <label for="max_sip_amount">Maximum SIP Amount (₹)</label>
                        <input type="number" class="form-control" id="max_sip_amount" name="max_sip_amount"
                               value="{{ plan.max_sip_amount}}" min="0" step="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Active" {% if plan.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if plan.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ plan.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="features" class="form-label">Features</label>
                        <textarea class="form-control" id="features" name="features" rows="5" placeholder="One feature per line">{{ plan.features }}</textarea>
                        <small class="text-muted">Enter each feature on a new line</small>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="has_copy_trading" name="has_copy_trading" {% if plan.has_copy_trading %}checked{% endif %}>
                            <label class="form-check-label" for="has_copy_trading">Enable Algo Investment</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="max_brokers" class="form-label">Maximum Brokers Allowed</label>
                        <input type="number" class="form-control" id="max_brokers" name="max_brokers" min="1" value="{{ plan.max_brokers }}">
                    </div>
                </div>
            </div>


            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('admin_view_plan', plan_id=plan.id) }}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
